name: Build Vortex-X APK (Zero-Cost Cloud Factory)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK components
        shell: bash
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Rust (3 Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core -> static libs
        shell: bash
        run: |
          cd rust-core
          cargo ndk -t armeabi-v7a -t arm64-v8a -t x86_64 \
              -o ../app/src/main/cpp/rust-libs build --release

      - name: Build hev-socks5-tunnel (tunnel engine)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/heiher/hev-socks5-tunnel.git hev
          cd hev
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          ./build-android-arm64.sh || true
          ./build-android-arm.sh || true
          ./build-android-x86_64.sh || true
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          copy_so() {
            local so="$1"; local abi="$2"
            if [ -f "$so" ]; then cp "$so" "app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"; echo "copied $abi"; fi
          }
          copy_so "hev/bin/arm64-v8a/libhev-socks5-tunnel.so" "arm64-v8a"
          copy_so "hev/bin/armeabi-v7a/libhev-socks5-tunnel.so" "armeabi-v7a"
          copy_so "hev/bin/x86_64/libhev-socks5-tunnel.so" "x86_64"
          # پشتیبان: اگر مسیر bin نبود، هر .so معتبری را با پترن پیدا کن
          for f in $(find hev -name "libhev-socks5-tunnel.so" 2>/dev/null); do
            case "$f" in
              *arm64-v8a*) copy_so "$f" "arm64-v8a";;
              *armeabi-v7a*) copy_so "$f" "armeabi-v7a";;
              *x86_64*) copy_so "$f" "x86_64";;
            esac
          done
          ls -la app/src/main/jniLibs/*/

      - name: Generate CI signing keystore
        shell: bash
        run: |
          keytool -genkeypair -v -keystore ci.keystore -alias vortex \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vortexx123 -keypass vortexx123 \
            -dname "CN=VortexX,O=Vortex,C=IR"

      - name: Build Release APK
        shell: bash
        run: |
          export VORTEX_KS="$(pwd)/ci.keystore"
          export VORTEX_KS_PASS="vortexx123"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Vortex-X-Pro.apk

      - name: Upload APK artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-X-Pro-apk
          path: Vortex-X-Pro.apk

      - name: Create GitHub Release with direct link (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vortex-X-Pro.apk
